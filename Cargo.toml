[workspace]
resolver = "2"
members = [
    "crates/canton-core",
    "crates/canton-cli",
    "crates/canton-ui",
    "crates/canton-tsf",
    "crates/canton-installer",
]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Security",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Globalization",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
